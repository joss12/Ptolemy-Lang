name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build Linux
        run: GOOS=linux GOARCH=amd64 go build -o ptolemy-linux

      - name: Build macOS Intel
        run: GOOS=darwin GOARCH=amd64 go build -o ptolemy-macos-intel

      - name: Build macOS ARM
        run: GOOS=darwin GOARCH=arm64 go build -o ptolemy-macos-arm

      - name: Build Windows
        run: GOOS=windows GOARCH=amd64 go build -o ptolemy-windows.exe

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ptolemy-linux
            ptolemy-macos-intel
            ptolemy-macos-arm
            ptolemy-windows.exe
